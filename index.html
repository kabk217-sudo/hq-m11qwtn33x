<style>
  :root { --bg:#0d0b14; --panel:#17131f; --line:#2c2540; --text:#e9e4f5; --muted:#8c84a3; --red:#ff4d4d; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); }
  body { font-family:'Press Start 2P', ui-monospace, Consolas, monospace; -webkit-text-size-adjust:100%; }
  header { display:flex; align-items:center; justify-content:space-between; gap:10px;
           padding:calc(env(safe-area-inset-top) + 10px) 18px 10px; border-bottom:4px solid var(--line); background:#120f1a; }
  h1 { margin:0; font-size:18px; letter-spacing:2px; color:#ff4d6d; text-shadow:3px 3px 0 #3a0d18; white-space:nowrap; }
  h1 span { color:var(--text); }
  #hdrR { display:flex; align-items:center; gap:12px; }
  #fresh { font-size:8px; padding:6px 8px; border:3px solid #3dff8b; color:#3dff8b; white-space:nowrap; }
  #clock { font-size:10px; color:var(--muted); text-align:right; line-height:1.7; white-space:nowrap; }
  main { display:grid; grid-template-columns:minmax(0,1fr) 410px; gap:16px; padding:14px 16px 16px; }
  #mapWrap { position:relative; min-width:0; min-height:0; display:flex; flex-direction:column; align-items:center; }
  #map { display:block; image-rendering:pixelated; image-rendering:crisp-edges; box-shadow:6px 6px 0 #000;
         cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  #ticker { font-family:ui-monospace, Consolas, monospace; font-size:12px; color:#cfc8e3; margin-top:8px; line-height:1.5; width:100%; max-width:900px; }
  #ticker div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center; }
  #ticker b { color:#fff; } #ticker .tt { color:var(--muted); }
  #mapFoot { font-size:8px; color:var(--muted); margin-top:10px; line-height:1.8; text-align:center; }
  #side { display:flex; flex-direction:column; gap:14px; min-width:0; }
  .card { background:var(--panel); border:4px solid var(--line); box-shadow:5px 5px 0 #000; padding:12px 14px; }
  .card h2 { margin:0 0 10px; font-size:9px; letter-spacing:1px; color:#b9b0d6; display:flex; justify-content:space-between; gap:8px; }
  .card h2 small { font-size:8px; color:var(--muted); letter-spacing:0; }
  .mono { font-family:ui-monospace, Consolas, Menlo, monospace; font-size:13px; line-height:1.45; }
  .muted { color:var(--muted); }
  .big { font-size:12px; line-height:1.7; color:#fff; }
  #msg { display:none; border-color:#4dd2ff; color:#bfefff; }
  #waitCard { border-color:#ffcc00; background:#2a2205; }
  #waitCard h2 { color:#ffe066; }
  .witem { display:flex; gap:8px; padding:6px 0; border-top:2px dashed #4a3f10; cursor:pointer; }
  .witem:first-of-type { border-top:none; }
  .witem b { font-family:'Press Start 2P', monospace; font-size:8px; color:#fff; flex:0 0 74px; padding-top:3px; }
  .witem span { color:#ffe9a0; }
  .blocks { display:flex; gap:6px; margin:8px 0; }
  .blk { width:34px; height:18px; border:3px solid #3dff8b; }
  .blk.on { background:#3dff8b; box-shadow:inset -3px -3px 0 #1f9a52; }
  .row2 { display:flex; justify-content:space-between; gap:10px; font-size:8px; line-height:1.9; }
  .ok { color:#3dff8b; } .warn { color:#ffcc00; } .bad { color:var(--red); }
  .slot { display:flex; gap:10px; align-items:baseline; padding:5px 0; border-top:2px solid #221c30; }
  .slot:first-of-type { border-top:none; }
  .slot .t { font-size:8px; flex:0 0 44px; color:#b9b0d6; }
  .slot .n { flex:1; min-width:0; }
  .slot.empty .n { color:var(--red); font-family:'Press Start 2P', monospace; font-size:8px; }
  .slot.past { opacity:.55; }
  .slot.next .t { color:#3dff8b; }
  .tag { font-size:7px; padding:2px 4px; border:2px solid; margin-left:6px; vertical-align:middle; }
  table.week { width:100%; border-collapse:collapse; table-layout:fixed; }
  .week td { padding:4px 3px; border-top:2px solid #221c30; vertical-align:top; }
  .week td.d { width:52px; font-size:8px; color:#b9b0d6; line-height:1.6; }
  .week tr.today td { background:#231c36; }
  .week tr.today td.d { color:#fff; }
  .week tr.past { opacity:.5; }
  .cell { font-family:ui-monospace, Consolas, monospace; font-size:11px; line-height:1.3; overflow:hidden;
          text-overflow:ellipsis; white-space:nowrap; padding:3px 4px; background:#1f2a22; border-left:3px solid #3dff8b; }
  .cell i { font-style:normal; color:#8fd6a8; font-size:10px; margin-right:4px; }
  .cell.empty { background:#3a0f12; border-left-color:var(--red); color:#ff8a8a; font-family:'Press Start 2P', monospace; font-size:7px; padding:5px 4px; }
  .cell.yt { background:#2a1619; border-left-color:#ff0033; }
  .cell.yt.done { background:#1f2a22; border-left-color:#3dff8b; }
  .cell .ok { color:#3dff8b; font-weight:bold; margin-right:5px; }
  .ytic { display:inline-block; width:13px; height:9px; background:#ff0033; border-radius:2px; position:relative; vertical-align:-1px; margin-right:5px; }
  .ytic::after { content:""; position:absolute; left:5px; top:2px; border-left:4px solid #fff; border-top:2.5px solid transparent; border-bottom:2.5px solid transparent; }
  #ytNext b { color:#fff; font-family:ui-monospace, Consolas, monospace; font-size:12px; font-weight:normal; }
  .goal { border-color:#4a3f8a; }
  .gbar { height:16px; border:3px solid #3a3350; background:#120f1a; margin:5px 0 9px; position:relative; }
  .gbar i { display:block; height:100%; box-shadow:inset -3px -3px 0 rgba(0,0,0,.3); }
  .stage { font-size:8px; line-height:1.9; color:#b9b0d6; margin-bottom:4px; }
  .stage b { color:#fff; font-weight:normal; }
  .cell.none { background:#1b1726; border-left-color:#3a3350; color:#5d5675; }
  .team { display:flex; align-items:center; gap:8px; padding:6px 0; border-top:2px solid #221c30; cursor:pointer; }
  .team:first-of-type { border-top:none; }
  .dot { width:10px; height:10px; flex:0 0 10px; }
  .team .nm { font-size:8px; flex:0 0 96px; }
  .team .st { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#cfc8e3; }
  .pill { font-size:8px; padding:5px 7px; border:3px solid; white-space:nowrap; }
  .working{ color:#3dff8b; border-color:#3dff8b; } .idle{ color:#9aa0b8; border-color:#9aa0b8; }
  .waiting{ color:#ffcc00; border-color:#ffcc00; } .done{ color:#4dd2ff; border-color:#4dd2ff; }
  .blocked{ color:#ff4d4d; border-color:#ff4d4d; }
  #card { display:none; position:absolute; left:12px; bottom:40px; width:min(460px, calc(100% - 24px)); z-index:6;
          background:#17131f; border:4px solid #b9b0d6; box-shadow:6px 6px 0 #000; padding:14px; max-height:70%; overflow:auto; }
  #card .top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  #card .nm { font-size:14px; } #card .rl { font-size:8px; color:var(--muted); margin-top:6px; }
  #card .lbl { font-size:8px; color:var(--muted); margin:12px 0 4px; }
  #card .wt { color:#ffe066; }
  #card .x { cursor:pointer; font-size:12px; padding:4px 8px; border:3px solid #4a4160; background:none; color:#fff; font-family:inherit; }
  #err { display:none; margin:12px 16px 0; padding:10px; border:4px solid var(--red); color:#ffb3b3; font-size:9px; line-height:1.9; }

  /* PC / landscape: map left, info right, no page scroll */
  @media (min-width:900px) and (orientation:landscape), (min-width:1101px) {
    body { height:100vh; display:flex; flex-direction:column; overflow:hidden; }
    main { flex:1; min-height:0; grid-template-rows:minmax(0,1fr); }
    #side { min-height:0; }
    #side { overflow-y:auto; padding-right:6px; padding-bottom:6px; }
    #mapWrap { overflow:hidden; }
  }
  /* phone / portrait: map on top, sections below */
  @media (max-width:899px), (orientation:portrait) and (max-width:1100px) {
    main { grid-template-columns:minmax(0,1fr); padding:10px 10px calc(16px + env(safe-area-inset-bottom)); gap:12px; }
    header { padding-left:12px; padding-right:12px; }
    h1 { font-size:14px; }
    #clock { font-size:8px; } #clock .dt { display:none; } #fresh { font-size:7px; padding:5px 6px; }
    #card { position:fixed; left:8px; right:8px; width:auto; bottom:calc(8px + env(safe-area-inset-bottom)); max-height:60vh; }
  }
</style>

<body>

<main>

  </div>

    <div class="card" id="msg"></div>

    <div class="card"><h2>NEXT STREAM <small id="nsWhen"></small></h2><div id="nsBig" class="big"></div><div id="nsWeek" class="mono muted" style="margin-top:8px;font-size:12px"></div></div>

<script>
"use strict";
// =====================================================================================
//  CONFIG
// =====================================================================================
const ZW = 96, ZH = 72, B = 4, SPEED = 18;          // zone size (logical px), border, walk speed px/s
const LAYOUTS = {
  land: { cols:3, rows:4, cells:[["jynxzi","ultron","kabob"], ["speed","work","joe"], ["case","research","zeph"], ["break","desk","sleep"]] },
  port: { cols:2, rows:6, cells:[["ultron","kabob"], ["jynxzi","speed"], ["work","research"], ["joe","case"], ["zeph","break"], ["sleep","desk"]] },
};
const ORDER = ["ultron","jynxzi","speed","joe","case","zeph","kabob"];
const PLATE = { ultron:"ULTRON", jynxzi:"JYNXZI", speed:"SPEED", joe:"JOE", case:"CASE", zeph:"ZEPH", kabob:"TRADER" };
const STATE_COL = { working:"#3dff8b", idle:"#9aa0b8", waiting:"#ffcc00", done:"#4dd2ff", blocked:"#ff4d4d" };
const STATE_TXT = { working:"WORKING", idle:"IDLE", waiting:"WAITING", done:"DONE", blocked:"BLOCKED" };
const LOOK = {
  ultron:{ robot:true, hair:"#9aa3b5", skin:"#c9d1de", eye:"#ff2e4d", shirt:"#3a3f55", pants:"#2a2e40", shoes:"#15171f" },
  jynxzi:{ hair:"#2a1a12", skin:"#e8b48a", shirt:"#2fbf71", pants:"#2b3550", headset:true },
  speed: { hair:"#111111", skin:"#8d5a3b", shirt:"#e63030", pants:"#1e1e24" },
  joe:   { hair:"#6a4428", skin:"#f0c39a", shirt:"#3a7bd5", pants:"#2a2a35" },
  case:  { hair:"#1a1a1a", skin:"#c68e65", shirt:"#4a4a4a", pants:"#2e3a52", hat:"#f26a0f" },
  zeph:  { hair:"#b388ff", skin:"#f2c7a5", shirt:"#7b2cbf", pants:"#2a2440", glasses:"#f2f2f2" },
  kabob: { hair:"#1a120c", skin:"#c68e65", shirt:"#1c1c1c", pants:"#24402c", shades:true, chain:true },
};
const THEME = {
  ultron:  { wall:"#2e2645", floor:["#3d3554","#373050"], pat:"tile" },
  jynxzi:  { wall:"#1e3d2d", floor:["#2f4f3e","#2a4838"], pat:"tile" },
  speed:   { wall:"#421e1e", floor:["#4f2d2d","#482828"], pat:"tile" },
  joe:     { wall:"#1e2d42", floor:["#2d3c50","#283648"], pat:"tile" },
  case:    { wall:"#3f341e", floor:["#4f432b","#483d26"], pat:"tile" },
  zeph:    { wall:"#2d1e42", floor:["#3c2d50","#362848"], pat:"tile" },
  kabob:   { wall:"#123222", floor:["#1f5232","#24603a"], pat:"carpet" },
  desk:    { wall:"#26213d", floor:["#3e3366","#4a3e78"], pat:"carpet" },
  break:   { wall:"#3d2c24", floor:["#7e5538","#734d32"], pat:"wood" },
  research:{ wall:"#1f2b3d", floor:["#2f3b52","#38465f"], pat:"carpet" },
  work:    { wall:"#20262f", floor:["#3a414d","#343a45"], pat:"tile" },
  sleep:   { wall:"#1c1934", floor:["#2b2652","#332d60"], pat:"carpet" },
};
const TRIM = "#0c0a11";
// which shared zone a WORKING agent goes to, from its task text
const RESEARCH_RX = /research|transcrib|study|studying|search|analys|analyz|scoring|scores?\b|fact-check|inspiration|dossier|reading|watching/i;
const WORK_RX = /edit|render|cutting|build|thumbnail|clip|caption|export|encod|design|making|mixing|upload/i;
const Q = new URLSearchParams(location.search);
const FAKE_H = Q.get("hour"), FAKE_CALL = Q.get("call") === "1";

// =====================================================================================
//  PIXEL HELPERS
// =====================================================================================
const FONT = {};
("A010101111101101 B110101110101110 C011100100100011 D110101101101110 E111100110100111 F111100110100100 " +
 "G011100101101011 H101101111101101 I111010010010111 J001001001101010 K101101110101101 L100100100100111 " +
 "M101111111101101 N110101101101101 O010101101101010 P110101110100100 Q010101101110011 R110101110101101 " +
 "S011100010001110 T111010010010010 U101101101101111 V101101101101010 W101101111111101 X101101010101101 " +
 "Y101101010010010 Z111001010100111 0111101101101111 1010110010010111 2110001010100111 3110001010001110 " +
 "4101101111001001 5111100110001110 6011100111101111 7111001010010010 8111101111101111 9111101111001110 " +
 "!010010010000010 .000000000000010 :000010000010000 -000000111000000 /001001010100100 ?110001010000010 " +
 "+000010111010000 '010010000000000 %101001010100101").split(" ").forEach(s => FONT[s[0]] = s.slice(1));
FONT[" "] = "000000000000000";

function px(c, x, y, w, h, col){ c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h); }
function txt(c, s, x, y, col, sc){
  sc = sc || 1; c.fillStyle = col; let cx = Math.round(x); y = Math.round(y);
  for (const ch of String(s).toUpperCase()){
    const g = FONT[ch] || FONT["?"];
    for (let i = 0; i < 15; i++) if (g[i] === "1") c.fillRect(cx + (i % 3) * sc, y + Math.floor(i / 3) * sc, sc, sc);
    cx += 4 * sc;
  }
}
const txtW = (s, sc) => (String(s).length * 4 - 1) * (sc || 1);
function shade(hex, f){
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, Math.round(((n >> 16) & 255) * f)));
  const g = Math.max(0, Math.min(255, Math.round(((n >> 8) & 255) * f)));
  const b = Math.max(0, Math.min(255, Math.round((n & 255) * f)));
  return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function circle(c, cx, cy, r, col){
  c.fillStyle = col;
  for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x*x + y*y <= r*r + r*0.6) c.fillRect(cx + x, cy + y, 1, 1);
}
function ring(c, cx, cy, r, col){
  c.fillStyle = col;
  for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++){ const d = x*x + y*y; if (d <= r*r + r*0.6 && d >= (r-1)*(r-1) - (r-1)*0.6) c.fillRect(cx + x, cy + y, 1, 1); }
}
function line(c, x0, y0, x1, y1, col){
  c.fillStyle = col; const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  for (let i = 0; i <= n; i++) c.fillRect(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), 1, 1);
}
function rnd(i){ const s = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); }

// =====================================================================================
//  CHARACTER SPRITES (14 x 22, front + back view, outlined, cached)
// =====================================================================================
const UPPER = [
  "....HHHHHH....", "...HHHHHHHH...", "..HHHHHHHHHH..", "..HHHHHHHHHH..", "..HSSSSSSSSH..",
  "..SSSSSSSSSS..", "..SSESSSSESS..", "..SSESSSSESS..", "..sSSSSSSSSs..", "...SSSMMSSS...",
  "....ssssss....", "...TTTTTTTT...", "..TTTTTTTTTT..", ".TTTTTTTTTTTT.", ".TTtTTTTTTtTT.",
  ".SStTTTTTTtSS.", "...tTTTTTTt...",
];
const BACK_ROWS = { 4:"..HHHHHHHHHH..", 5:"..HHHHHHHHHH..", 6:"..HHHHHHHHHH..", 7:"..hHHHHHHHHh..", 8:"..shhhhhhhhs..", 9:"...SSSSSSSS..." };
const LEGS = {
  stand:["....PPPPPP....", "....PPppPP....", "....PP..PP....", "....PP..PP....", "...BBB..BBB..."],
  a:    ["....PPPPPP....", "....PP..PP....", "....PP..PP....", "...BBB..PP....", "........BBB..."],
  b:    ["....PPPPPP....", "....PP..PP....", "....PP..PP....", "....PP..BBB...", "...BBB........"],
  sit:  ["...PPPPPPPP...", "...PPPPPPPP...", "...BB....BB..."],
};
const HAT = ["....AAAAAA....", "...AAAAAAAA...", "..AAAAAAAAAA..", "..aaaaaaaaaa.."];
const HARDHAT = ["....AAAAAA....", "...AAAAAAAA...", "..AAAAAAAAAA..", ".aaaaaaaaaaaa."];

function extraLook(name){
  const n = (name || "").toLowerCase();
  if (n.includes("build") || n.includes("hq")) return { hair:"#5a3a22", skin:"#e0b48c", shirt:"#ff8c1a", pants:"#2e3a52", hardhat:"#ffd60a" };
  let h = 0; for (const ch of n) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const shirts = ["#e07a5f","#3d9970","#f2cc8f","#81b29a","#e76f51","#2a9d8f","#ff70a6"];
  const hairs = ["#2a1a12","#6a4428","#111","#d4a373","#8d5524"];
  return { hair:hairs[h % hairs.length], skin:"#e0b48c", shirt:shirts[h % shirts.length], pants:"#2a2a35" };
}
function palette(L){
  const hair = L.hair, hat = L.hat || L.hardhat || hair;
  return { H:hair, h:shade(hair, .72), S:L.skin, s:shade(L.skin, .8), E:L.eye || "#1a1a1a", M:L.robot ? "#2a2e40" : shade(L.skin, .62),
           T:L.shirt, t:shade(L.shirt, .7), P:L.pants, p:shade(L.pants, .75), B:L.shoes || "#141414", A:hat, a:shade(hat, .72),
           K:"#3c3c48", G:"#0a0a0a", g:"#8a8aa0", Y:"#ffcc33", W:L.glasses || "#eeeeee", V:"#1a0a10", R:"#ff2e4d" };
}
function spriteRows(L, view, closed, dx, legs){
  let rows = UPPER.map((r, i) => (view === "back" && BACK_ROWS[i]) ? BACK_ROWS[i] : r).concat(LEGS[legs]).map(r => r.split(""));
  const set = (x, y, ch) => { if (rows[y] && x >= 0 && x < 14) rows[y][x] = ch; };
  if (view !== "back"){
    for (const y of [6, 7]) for (let x = 0; x < 14; x++) if (rows[y][x] === "E") rows[y][x] = "S";
    if (closed){ [4, 5, 8, 9].forEach(x => set(x, 7, "s")); }
    else { [6, 7].forEach(y => { set(4 + dx, y, "E"); set(9 + dx, y, "E"); }); }
  }
  if (L.hat) HAT.forEach((r, i) => rows[i] = r.split(""));
  if (L.hardhat) HARDHAT.forEach((r, i) => rows[i] = r.split(""));
  if (L.headset){
    for (let x = 4; x <= 9; x++) set(x, 0, "K");
    [5, 6, 7].forEach(y => { set(1, y, "K"); set(12, y, "K"); });

function getSprite(key, L, view, closed, dx, legs){

    if (!solid(x, y) && (solid(x-1, y) || solid(x+1, y) || solid(x, y-1) || solid(x, y+1))) c.fillRect(x + 1, y + 1, 1, 1);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){

}

function zoneAt(x, y){
  const c = Math.max(0, Math.min(M.lay.cols - 1, Math.floor((x - B) / ZW)));
  const r = Math.max(0, Math.min(M.lay.rows - 1, Math.floor((y - B) / ZH)));
  return M.by[M.lay.cells[r][c]];
}
const hub = z => ({ x:z.ox + 52, y:z.oy + 46 });
function bfs(a, b){
  if (a === b) return [a];
  const prev = new Map([[a, null]]), q = [a];
  while (q.length){
    const z = q.shift();
    for (const [dc, dr] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const row = M.lay.cells[z.row + dr]; const k = row && row[z.col + dc]; const n = k && M.by[k];
      if (!n || prev.has(n)) continue; prev.set(n, z); if (n === b){ q.length = 0; break; } q.push(n);
    }
  }
  const out = []; let z = b; while (z){ out.unshift(z); z = prev.get(z); } return out;
}
function doorPts(a, b){
  if (a.row === b.row){
    const X = B + Math.max(a.col, b.col) * ZW, y = a.oy + 46, s = b.col > a.col ? 1 : -1;
    return [{ x:X - 9*s, y }, { x:X + 9*s, y }];
  }
  const x = a.ox + 52, Y = B + Math.max(a.row, b.row) * ZH;
  return b.row > a.row ? [{ x, y:Y - 3 }, { x, y:Y + 25 }] : [{ x, y:Y + 25 }, { x, y:Y - 3 }];
}
function route(A, to){
  if (A.at === to) return [];
  const pts = [];
  if (A.at) for (let i = A.at.via.length - 1; i >= 0; i--) pts.push(A.at.via[i]);
  const st = pts.length ? pts[pts.length - 1] : { x:A.x, y:A.y };
  const za = zoneAt(st.x, st.y), cells = bfs(za, to.z);
  pts.push(hub(za));
  for (let i = 0; i < cells.length - 1; i++) pts.push(...doorPts(cells[i], cells[i + 1]));
  if (cells.length > 1) pts.push(hub(to.z));
  pts.push(...to.via, { x:to.x, y:to.y });
  return pts;
}

function floorCol(th, lx, ly){
  const f = th.floor;
  if (th.pat === "tile"){ const base = ((lx >> 3) + (ly >> 3)) % 2 ? f[0] : f[1]; return (lx % 8 === 0 || ly % 8 === 0) ? shade(base, .86) : base; }
  if (th.pat === "wood"){ const row = ly >> 2, seam = (row * 13) % 24; if (ly % 4 === 0) return shade(f[0], .82); if ((lx + seam) % 24 === 0) return shade(f[0], .7); return row % 2 ? f[0] : f[1]; }
  if (th.pat === "carpet"){ return ((lx * 7 + ly * 13) % 11 === 0) ? f[1] : f[0]; }
  return f[0];
}
function fillFloor(c, z, lx0, ly0, w, h){
  const th = THEME[z.key] || THEME.break;
  for (let ly = ly0; ly < ly0 + h; ly++){
    let run = 0, runCol = null, runX = lx0;
    for (let lx = lx0; lx <= lx0 + w; lx++){
      const col = lx < lx0 + w ? floorCol(th, ((lx % 96) + 96) % 96, ((ly % 72) + 72) % 72) : null;
      if (col !== runCol){ if (runCol) px(c, z.ox + runX, z.oy + ly, run, 1, runCol); runCol = col; run = 1; runX = lx; } else run++;
    }
  }
}

  const step = act ? t / 600 | 0 : 0; let prev = null;
  for (let i = 0; i < 16; i++){ const v = 3 + Math.round(rnd(i + step) * 8); const p = [x + 1 + i, y + 13 - v]; if (prev) line(c, prev[0], prev[1], p[0], p[1], "#4dd2ff"); prev = p; }
  px(c, x + 1, y + 13, 16, 1, "#2a3a4a");
  px(c, x + 21, y, 18, 3, "#3a7bd5");
  const sc = act ? (t / 400 | 0) % 6 : 0;
  for (let i = 0; i < 5; i++) px(c, x + 23, y + 4 + i * 2, 6 + ((i + sc) * 5) % 9, 1, "#8c94a6");
  px(c, x + 32, y + 4, 5, 5, "#c9d6e8");
}
function drawRender(c, x, y, t, busy){                         // edit bay wall: render progress
  frame(c, x, y, 38, 15, "#0d1014");
  txt(c, busy ? "RENDER" : "IDLE", x + 2, y + 1, busy ? "#3dff8b" : "#5a6a5a");
  [0, 1].forEach(i => {
    const p = busy ? ((t / (60 + i * 37)) % 100) / 100 : 1;
    px(c, x + 2, y + 8 + i * 4, 34, 3, "#26303a"); px(c, x + 2, y + 8 + i * 4, Math.round(34 * p), 3, busy ? (i ? "#4dd2ff" : "#3dff8b") : "#2a4a3a");
  });
}
function drawTimeline(c, x, y, t, busy){
  frame(c, x, y, 30, 11, "#141418");
  [["#e63946", 2, 9], ["#3a7bd5", 12, 7], ["#2fbf71", 20, 8]].forEach(([col, s, w], i) => { px(c, x + s, y + 2, w, 2, col); px(c, x + s + 2, y + 5, w - 3, 2, shade(col, .7)); });
  for (let i = 0; i < 28; i++) px(c, x + 1 + i, y + 8, 1, 1 + (rnd(i) * 2 | 0), "#5a5a6a");
  px(c, busy ? x + 1 + ((t / 90 | 0) % 28) : x + 14, y + 1, 1, 9, "#ffcc00");
}
function deskColors(st, t){
  if (st === "working") return "#5ab0ff";
  if (st === "blocked") return (t / 250 | 0) % 2 ? "#ff3030" : "#5a0f0f";
  if (st === "waiting") return (t / 400 | 0) % 2 ? "#ffcc00" : "#7a6000";
  if (st === "done") return "#3dff8b";
  return "#2a2a3a";
}
function occupantAt(s){ const A = s && s.occ && agents.get(s.occ); return A && A.at === s && !A.walking ? A : null; }
function busyIn(list){ return list.some(s => { const A = occupantAt(s); return A && A.vis === "work"; }); }

// back layer: walls (windows, clocks, screens, signs) - every frame, under furniture/agents
function drawWalls(c, t, sky, glow){
  for (const z of M.zones){
    const { ox, oy, key } = z;
    const A = agents.get(key), st = A ? A.d.state : "idle", act = st === "working";
    if (key === "ultron"){
      if (z.row === 0) drawWindow(c, ox + 5, oy + 4, t, sky); else drawClock(c, ox + 16, oy + 11);
      const call = callActive();
      drawCallScreen(c, ox + 40, oy + 2, t, call); glow.push(() => drawCallScreen(c, ox + 40, oy + 2, t, call));
      continue;
    }
    if (key === "desk"){
      const live = isLive();
      px(c, ox + 9, oy + 1, 27, 8, "#08080c"); px(c, ox + 10, oy + 2, 25, 6, live ? "#d62828" : "#3a1414");
      txt(c, "ON AIR", ox + 11, oy + 2, live ? "#ffffff" : "#6a3434");
      if (live) glow.push(() => { px(c, ox + 10, oy + 2, 25, 6, "#d62828"); txt(c, "ON AIR", ox + 11, oy + 2, "#ffffff"); });
      const n = waitingAgents().length;
      frame(c, ox + 62, oy + 4, 30, 15, "#10261a");
      txt(c, "INBOX", ox + 67, oy + 5, "#8fd6a8");
      const s = String(n); txt(c, s, ox + 77 - Math.floor(txtW(s) / 2), oy + 12, n ? ((t / 500 | 0) % 2 ? "#ffcc00" : "#fff1a8") : "#3dff8b");
      continue;
    }
    if (key === "break"){
      drawTV(c, ox + 6, oy + 4, t); glow.push(() => drawTV(c, ox + 6, oy + 4, t));
      sign(c, "BREAK", ox + 61, oy + 1, 31);
      continue;
    }
    if (key === "research"){
      const b = busyIn(M.research);
      drawCharts(c, ox + 4, oy + 4, t, b); glow.push(() => drawCharts(c, ox + 4, oy + 4, t, b));
      sign(c, "RESEARCH", ox + 59, oy + 1, 35);
      px(c, ox + 61, oy + 9, 32, 12, "#8c84a3"); px(c, ox + 62, oy + 10, 30, 10, "#f4f2f8");
      line(c, ox + 64, oy + 17, ox + 70, oy + 12, "#3a7bd5"); line(c, ox + 70, oy + 12, ox + 75, oy + 15, "#3a7bd5"); line(c, ox + 75, oy + 15, ox + 80, oy + 11, "#3a7bd5");
      px(c, ox + 83, oy + 11, 4, 4, "#ffe066"); px(c, ox + 88, oy + 13, 3, 3, "#ff9fc0"); px(c, ox + 64, oy + 11, 4, 1, "#e63946");
      continue;
    }
    if (key === "work"){
      const b = busyIn(M.work);
      drawRender(c, ox + 4, oy + 3, t, b); glow.push(() => drawRender(c, ox + 4, oy + 3, t, b));
      sign(c, "EDIT BAY", ox + 59, oy + 1, 35);
      drawTimeline(c, ox + 62, oy + 10, t, b); glow.push(() => drawTimeline(c, ox + 62, oy + 10, t, b));
      continue;
    }
    if (key === "sleep"){
      sign(c, "BUNKS", ox + 8, oy + 2, 25);
      circle(c, ox + 38, oy + 7, 2, "#ffe9a0"); glow.push(() => circle(c, ox + 38, oy + 7, 2, "#ffe9a0"));
      continue;
    }
    if (z.row === 0) drawWindow(c, ox + 5, oy + 4, t, sky); else drawClock(c, ox + 16, oy + 11);
    const scr = SCREENS[key];
    if (scr){ scr(c, ox + 62, oy + 3, t, act, st); glow.push(() => scr(c, ox + 62, oy + 3, t, act, st)); }
  }
}

  if (!M || !CTX) return;
  const c = CTX, t = now;
  for (const A of agents.values()) updateAgent(A, dt, now);
  if (!M.bg) buildBg();
  c.drawImage(M.bg, 0, 0);
  const sky = skyNow(), glow = [];
  drawWalls(c, t, sky, glow);
  const D = [];
  furniture(D, t, glow);
  for (const A of agents.values()) D.push({ y:A.y + 0.5, f:cc => drawAgent(cc, A, now) });
  D.sort((a, b) => a.y - b.y);
  for (const d of D) d.f(c);
  const sl = M.by.sleep; if (sl){ c.fillStyle = "rgba(4,4,24,.30)"; c.fillRect(sl.ox, sl.oy, ZW, ZH); }
  if (sky.tint){ c.fillStyle = "rgba(6,8,32," + sky.tint + ")"; c.fillRect(0, 0, M.W, M.H); glow.forEach(f => f()); }
  const placed = [];
  [...agents.values()].sort((a, b) => b.y - a.y).forEach(A => drawOver(c, A, now, placed));
}

function narrowMode(){ return matchMedia("(max-width:899px), (orientation:portrait) and (max-width:1100px)").matches; }
function fit(){
  const kind = narrowMode() ? "port" : "land";
  if (!M || M.kind !== kind){
    for (const A of agents.values()){ A.target = null; A.at = null; A.errand = null; A.errands = []; }
    buildModel(kind); backK = 0; resetPlaces(true);
  }
  const wrap = document.getElementById("mapWrap");
  const below = document.getElementById("mapFoot").offsetHeight + document.getElementById("ticker").offsetHeight + 22;
  const aw = wrap.clientWidth;
  const ah = kind === "port" ? Infinity : Math.max(200, wrap.clientHeight - below);
  let s = Math.min(aw / M.W, ah / M.H);
  const dpr = window.devicePixelRatio || 1, fl = Math.floor(s * dpr) / dpr;
  if (fl >= 1 && fl / s > 0.88) s = fl;                              // crisp integer scale when it costs little
  const target = s * dpr, k = Math.abs(target - Math.round(target)) < 0.02 ? 1 : Math.min(4, Math.ceil(target));
  if (k !== backK || cv.width !== M.W * k){
    backK = k; cv.width = M.W * k; cv.height = M.H * k;
    CTX = cv.getContext("2d"); CTX.setTransform(k, 0, 0, k, 0, 0); CTX.imageSmoothingEnabled = false;
    cv.style.imageRendering = k === 1 ? "" : "auto";
  }
  cv.style.width = Math.floor(M.W * s) + "px"; cv.style.height = Math.floor(M.H * s) + "px";
}
addEventListener("resize", fit);

// click / tap on the map
cv.addEventListener("click", e => {
  const r = cv.getBoundingClientRect(), k = r.width / M.W;
  const x = (e.clientX - r.left) / k, y = (e.clientY - r.top) / k;
  let hit = null;
  for (const A of agents.values()){
    const t = (A.top ?? A.y - 22) - (A.atDesk ? 0 : 9);
    const x1 = A.pose === "bed" && !A.walking ? A.x + 23 : A.x + 8;
    if (x >= A.x - 8 && x <= x1 && y >= t && y <= A.y + 2 && (!hit || A.y > hit.y)) hit = A;
  }
  if (!hit){ const z = zoneAt(x, y); if (z && agents.has(z.key)) hit = agents.get(z.key); else if (z && z.key === "desk"){ document.getElementById("waitCard").scrollIntoView({ behavior:"smooth" }); return; } }
  if (hit) openCard(hit.key); else closeCard();
});

function renderTicker(){

  document.getElementById("ticker").innerHTML = items.map(e => `<div><span class="tt">${new Date(e.ms).toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" })}</span> <b>${esc(String(e.from).toUpperCase())}</b> &rarr; <b>${esc(String(e.to).toUpperCase())}</b> ${esc(e.what)}</div>`).join("");

let seenEv = new Set(); try { seenEv = new Set(JSON.parse(localStorage.getItem("hqSeenEvents") || "[]")); } catch (e) {}

  if (ch) try { localStorage.setItem("hqSeenEvents", JSON.stringify([...seenEv].slice(-300))); } catch (e) {}

function openCard(key){

    <div class="lbl">WORKING ON / LAST DONE</div><div class="mono">${esc(a.task) || "—"}</div>

function slotMin(s){ const m = /^(\d{1,2})(?::(\d{2}))?\s*([ap]m)$/i.exec(s || ""); if (!m) return 9999; let h = +m[1] % 12; if (m[3].toLowerCase() === "pm") h += 12; if (h === 0) h = 24; return h * 60 + (+m[2] || 0); }
function renderSide(){
  const C = cfg(), agentsArr = data.agents || [];

    ${C.affiliate_deadline ? `<div class="row2"><span>AIM</span><span>${esc(C.affiliate_deadline)}</span></div>` : ""}
    ${C.affiliate_note ? `<div class="mono muted" style="margin-top:6px;font-size:12px">${esc(C.affiliate_note)}</div>` : ""}`;
  renderSchedule();

  document.getElementById("teamLbl").textContent = tm.filter(a => a.state === "working").length + " WORKING";
  document.getElementById("team").innerHTML = tm.map(a => `<div class="team" data-k="${esc(keyOf(a.name))}"><div class="dot" style="background:${STATE_COL[a.state]}"></div>
    <div class="nm">${esc(dispName(a))}</div><div class="st">${esc((a.state === "working" && a.eta && a.eta !== "—" ? "ETA " + a.eta + " · " : "") + a.task)}</div></div>`).join("");
  document.getElementById("mapFoot").textContent = `Status file updated ${data.file_updated || "?"} · tap an agent for details`;

function renderSchedule(){
  const S = data.schedule || {}, C = cfg(), slots = C.slots || ["1pm", "6pm", "9pm"];
  const now = new Date(), todayN = (now.getDay() + 6) % 7 + 1, nowMin = now.getHours() * 60 + now.getMinutes();
  const mon = new Date(now); mon.setDate(now.getDate() - (todayN - 1));
  const fmt = d => d.toLocaleDateString("en-GB", { day:"numeric", month:"short" });
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  document.getElementById("weekLbl").textContent = fmt(mon).toUpperCase() + " - " + fmt(sun).toUpperCase();
  const today = document.getElementById("today"), week = document.getElementById("week");
  if (!S.ok){ today.innerHTML = week.innerHTML = `<span class="bad">Can't see the TT folder right now (Google Drive not mounted?)</span>`; document.getElementById("bank").innerHTML = ""; return; }
  const day = S.days.find(d => d.num === todayN) || { posts:[] };
  const all = [...new Set(slots.concat(day.posts.map(p => p.slot)).filter(Boolean))].sort((a, b) => slotMin(a) - slotMin(b));
  let nextDone = false;
  document.getElementById("todayLbl").textContent = now.toLocaleDateString("en-GB", { weekday:"short" }).toUpperCase() + " · " + day.posts.length + "/" + slots.length;
  today.innerHTML = all.map(s => {
    const p = day.posts.find(x => x.slot === s), past = slotMin(s) <= nowMin;
    let cls = p ? "" : "empty"; if (past) cls += " past"; let tag = "";
    if (!past && !nextDone){ cls += " next"; tag = `<span class="tag ok">NEXT</span>`; nextDone = true; }
    return `<div class="slot ${cls}"><div class="t">${esc(s.toUpperCase())}</div><div class="n">${p ? esc(p.title) : "EMPTY - NEEDS A SHORT"}${tag}</div></div>`;
  }).join("") + day.posts.filter(p => !p.slot).map(p => `<div class="slot"><div class="t">?</div><div class="n">${esc(p.title)}</div></div>`).join("");
  week.innerHTML = S.days.map(d => {
    const ds = new Date(mon); ds.setDate(mon.getDate() + d.num - 1);
    const past = d.num < todayN, isT = d.num === todayN;
    const cols = [...new Set(slots.concat(d.posts.map(p => p.slot)).filter(Boolean))].sort((a, b) => slotMin(a) - slotMin(b));
    const cells = cols.map(s => { const p = d.posts.find(x => x.slot === s);
      return p ? `<div class="cell" title="${esc(s + " - " + p.title)}"><i>${esc(s)}</i>${esc(p.title)}</div>` : `<div class="cell ${past ? "none" : "empty"}">${esc(s.toUpperCase())} ${past ? "-" : "EMPTY"}</div>`; }).join("");
    return `<tr class="${isT ? "today" : ""} ${past ? "past" : ""}"><td class="d">${d.day.toUpperCase()}<br>${ds.getDate()}</td><td>${cells}</td></tr>`;
  }).join("");
  const empties = S.days.filter(d => d.num >= todayN).reduce((n, d) => n + slots.filter(s => !d.posts.some(p => p.slot === s)).length, 0);
  document.getElementById("bank").innerHTML = `<span>BANK (UNSCHEDULED): <b class="${S.bank ? "ok" : "warn"}">${S.bank}</b></span><span class="${empties ? "bad" : "ok"}">${empties ? empties + " EMPTY SLOT" + (empties > 1 ? "S" : "") : "ALL FILLED"}</span>`;
}
const AFF_DONE = Q.get("affdone") === "1";
function gbar(v, max, col){ const p = v == null ? 0 : Math.max(0, Math.min(100, v / max * 100)); return `<div class="gbar"><i style="width:${p}%;background:${col}"></i></div>`; }
const fmtN = v => v == null ? "?" : Number(v).toLocaleString("en-GB", { maximumFractionDigits:1 });
function renderGoals(){
  const G = data.growth || {}, done = G.affiliate_done || AFF_DONE;

  document.getElementById("ytGoalBody").innerHTML = `

    <div class="row2"><span>SUBSCRIBERS${G.yt_subs_auto ? ' <span class="ok">· LIVE</span>' : ""}</span><span class="${subs >= subT ? "ok" : "warn"}">${fmtN(subs)} / ${fmtN(subT)}</span></div>${gbar(subs, subT, "#ff0033")}

    <div class="mono muted" style="font-size:12px">Shorts hours don't count.${G.yt_hours_updated ? " Hours as of " + esc(G.yt_hours_updated) + "." : ""}</div>`;
  // Twitch: 50 followers + 5 average viewers (last 5 streams)

function ymd(d){ return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function ytWhen(e){ const d = new Date((e.date || "") + "T00:00:00"); if (isNaN(d)) return null; const m = slotMin(String(e.time || cfg().youtube_slot || "").replace(/\s+/g, "").toLowerCase()); if (m < 9999) d.setMinutes(m); return d; }
function renderYouTube(){
  const C = cfg(), list = Array.isArray(C.youtube_schedule) ? C.youtube_schedule : [], card = document.getElementById("ytCard");
  if (!list.length && !C.youtube_slot){ card.style.display = "none"; return; } card.style.display = "";

    ? `<span>NEXT UPLOAD</span><b>${esc(ytWhen(nxt).toLocaleDateString("en-GB", { weekday:"short" }))} ${esc(nxt.time || C.youtube_slot || "")} · ${esc(nxt.title)}</b>`

    const items = list.filter(e => e.date === ymd(d)).sort((a, b) => (ytWhen(a) || 0) - (ytWhen(b) || 0));

        return `<div class="cell yt ${o ? "done" : ""}" title="${esc((e.time || "") + " - " + e.title + (e.status === "posted" ? " (posted)" : o ? " (should be live)" : " (scheduled)"))}"><span class="ytic"></span><i>${esc(e.time || C.youtube_slot || "")}</i>${o ? '<span class="ok">✓</span>' : ""}${esc(e.title)}</div>`; }).join("")
      : `<div class="cell empty">${past ? "NO REACT POSTED" : "EMPTY - NO REACT" + (C.youtube_slot ? " (" + esc(C.youtube_slot.toUpperCase()) + ")" : "")}</div>`;
    return `<tr class="${isT ? "today" : ""} ${past ? "past" : ""}"><td class="d">${day}<br>${d.getDate()}</td><td>${cells}</td></tr>`;
  }).join("");
  document.getElementById("ytLbl").textContent = filled + "/7 DAYS";
}
document.getElementById("side").addEventListener("click", e => { const el = e.target.closest("[data-k]"); if (el) openCard(el.dataset.k); });

function freshness(){
  const el = document.getElementById("fresh");
  if (!data.generated){ el.textContent = "NO DATA"; el.style.color = el.style.borderColor = "#ff4d4d"; return; }
  const mins = Math.floor((Date.now() - data.generated) / 60000);
  let txt, col;
  if (isLocal && mins < 2){ txt = "● LIVE (PC)"; col = "#3dff8b"; }
  else if (mins < 1){ txt = "● UPDATED JUST NOW"; col = "#3dff8b"; }
  else if (mins < 12){ txt = "● UPDATED " + mins + " MIN AGO"; col = "#3dff8b"; }
  else if (mins < 45){ txt = "UPDATED " + mins + " MIN AGO"; col = "#ffcc00"; }
  else { const h = mins >= 120 ? Math.floor(mins / 60) + "H" : mins + " MIN"; txt = "PC OFF? LAST " + h + " AGO"; col = "#ff4d4d"; }
  el.textContent = txt; el.style.color = el.style.borderColor = col;
}
function clock(){
  const d = new Date();
  document.getElementById("clock").innerHTML = '<span class="dt">' + d.toLocaleDateString("en-GB", { weekday:"short", day:"numeric", month:"short" }) + "<br></span>" + d.toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" });
  freshness();

async function refresh(){
  try {
    const r = await fetch("status.json?t=" + Date.now(), { cache:"no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    document.getElementById("err").style.display = "none";
    const s = JSON.stringify({ ...j, generated:0, generated_text:"" });
    data = j;
    if (s !== lastJson){ lastJson = s; syncAgents(j.agents || []); handleEvents(j.events); renderSide(); if (sel) openCard(sel); fit(); }
    if (Q.get("demo") === "1" && !window._demo){ window._demo = 1; queueErrand("Jynxzi", "Speed", "8 picks"); queueErrand("Zeph", "Ultron", "scores in"); reports.unshift({ from:"Jynxzi", to:"Speed", what:"8 picks (demo)", ms:Date.now() }); renderTicker(); }
  } catch (e){
    const el = document.getElementById("err"); el.style.display = "block";
    el.innerHTML = isLocal ? `Can't read the status feed. Open the <b>Ultron HQ</b> app (or "Open Dashboard.bat"), not index.html directly.` : `Can't load status.json (${esc(e.message)}). Check your signal.`;
  }
  clock();
}

fit();
refresh();
if (Q.get("dbg")) setTimeout(() => { const o = {}; ["main","mapWrap","side","ticker","map","mapFoot","waitCard","week","today","team"].forEach(id => { const el = id === "main" ? document.querySelector("main") : document.getElementById(id); if (el) o[id] = el.getBoundingClientRect().width + "/" + el.scrollWidth; });
  o.body = document.body.scrollWidth; o.vw = innerWidth; const pre = document.createElement("pre"); pre.id = "dbg"; pre.textContent = JSON.stringify(o); document.body.appendChild(pre); }, 2500);
setInterval(refresh, isLocal ? 10000 : 60000);
setInterval(clock, 1000);
setInterval(() => { if (data.schedule) renderSchedule(); renderYouTube(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
requestAnimationFrame(render);
